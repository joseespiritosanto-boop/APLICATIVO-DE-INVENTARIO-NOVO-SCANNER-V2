<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SPX Scanner Rápido</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0F172A;
      color: #FFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top {
      background: linear-gradient(135deg, #EE4D2D, #FF6B3D);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 800;
      font-size: 14px;
    }
    .top-right { display: flex; align-items: center; gap: 8px; }
    .badge-cnt {
      background: #0F172A;
      color: #34D399;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
    }
    .badge-modo {
      background: rgba(0,0,0,0.28);
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
    }
    #reader {
      width: 100%;
      flex: 1;
      min-height: 240px;
      max-height: 48vh;
      background: #000;
      overflow: hidden;
    }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
    .status-bar {
      padding: 9px 14px;
      background: #1E293B;
      font-size: 12.5px;
      font-weight: 700;
      text-align: center;
      border-top: 1px solid #334155;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-bar.ok { background: #065F46; color: #D1FAE5; }
    .status-bar.err { background: #991B1B; color: #FEE2E2; }
    .historico {
      background: #0B1120;
      padding: 6px 12px;
      font-size: 11.5px;
      color: #CBD5E1;
      max-height: 58px;
      overflow-y: auto;
      border-bottom: 1px solid #1E293B;
    }
    .historico div { padding: 2px 0; border-bottom: 1px dashed rgba(148,163,184,0.14); }
    .panel {
      padding: 10px 12px 14px;
      background: #1E293B;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    select, input {
      width: 100%;
      padding: 10px 11px;
      border-radius: 9px;
      border: 1px solid #475569;
      background: #0F172A;
      color: #FFF;
      font-size: 13.5px;
      outline: none;
    }
    input:focus, select:focus { border-color: #EE4D2D; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn {
      padding: 11px;
      border: none;
      border-radius: 9px;
      font-weight: 800;
      font-size: 13px;
      color: #FFF;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.98); }
    .btn-switch { background: #2563EB; }
    .btn-send { background: #EE4D2D; }
    .btn-clear { background: #334155; }
  </style>
</head>
<body>

  <div class="top">
    <span>⚡ SPX Inventário Rápido</span>
    <div class="top-right">
      <span class="badge-modo" id="lblModo">INVENTÁRIO</span>
      <span class="badge-cnt" id="cntLidos">0 lidos</span>
    </div>
  </div>

  <div id="reader"></div>
  <div class="status-bar" id="statusBar">Aponte para o código — bipagem contínua ativa</div>
  <div class="historico" id="historicoBox">Aguardando primeira leitura...</div>

  <div class="panel">
    <div class="row">
      <select id="selModo" onchange="salvarPrefs()">
        <option value="INVENTARIO">📦 Inventário Geral</option>
        <option value="ELETRONICOS">🖨️ Eletrônicos</option>
      </select>
      <input type="text" id="inpLocal" placeholder="Local (salva auto)" oninput="salvarPrefs()" />
    </div>

    <div class="row">
      <input type="text" id="inpManual" placeholder="Serial / QR / Leitor..." onkeydown="if(event.key==='Enter'){processarCodigo(this.value);}" />
      <button class="btn btn-send" onclick="processarCodigo(document.getElementById('inpManual').value)">✅ Bip / Validar</button>
    </div>

    <div class="row">
      <button class="btn btn-switch" onclick="trocarCamera()">🔄 Câmera</button>
      <button class="btn btn-clear" onclick="zerarContador()">↺ Zerar (0)</button>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var API_URL = params.get("api") || localStorage.getItem("SPX_WEBAPP_API") || "";
    var MODO_INICIAL = params.get("modo") || localStorage.getItem("SPX_MODO_SCAN") || "INVENTARIO";
    var LOCAL_SALVO = localStorage.getItem("SPX_LOCAL_SCAN") || "";

    if (API_URL) localStorage.setItem("SPX_WEBAPP_API", API_URL);
    document.getElementById("selModo").value = MODO_INICIAL;
    document.getElementById("inpLocal").value = LOCAL_SALVO;
    atualizarBadgeModo();

    var totalLidos = 0;
    var html5Qr = null;
    var cameras = [];
    var idxCam = 0;
    var ultimoCod = "";
    var ultimoTs = 0;
    var filaEnvio = Promise.resolve();

    function atualizarBadgeModo() {
      var m = document.getElementById("selModo").value;
      document.getElementById("lblModo").textContent = m === "ELETRONICOS" ? "🖨️ Eletrônicos" : "📦 Inventário";
    }

    function salvarPrefs() {
      atualizarBadgeModo();
      localStorage.setItem("SPX_MODO_SCAN", document.getElementById("selModo").value);
      localStorage.setItem("SPX_LOCAL_SCAN", document.getElementById("inpLocal").value.trim());
    }

    function zerarContador() {
      totalLidos = 0;
      document.getElementById("cntLidos").textContent = "0 lidos";
      document.getElementById("historicoBox").innerHTML = "Contador zerado.";
    }

    function adicionarHistorico(cod, okTexto) {
      totalLidos++;
      document.getElementById("cntLidos").textContent = totalLidos + " lidos";
      var box = document.getElementById("historicoBox");
      if (box.textContent.indexOf("Aguardando") === 0 || box.textContent.indexOf("Contador zerado") === 0) {
        box.innerHTML = "";
      }
      var hora = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      var linha = document.createElement("div");
      linha.textContent = "[" + hora + "] " + cod + " — " + okTexto;
      box.insertBefore(linha, box.firstChild);
    }

    function setStatus(tipo, texto) {
      var el = document.getElementById("statusBar");
      el.className = "status-bar " + (tipo || "");
      el.textContent = texto;
    }

    function bipSonoro() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 1050;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(function() { osc.stop(); ctx.close(); }, 80);
      } catch (e) {}
    }

    function enviarParaApi(codigo, modo, local) {
      if (!API_URL) {
        return Promise.resolve({ ok: false, msg: "Sem API_URL (abra pelo Painel)" });
      }
      var bodyStr = JSON.stringify({
        acao: modo === "ELETRONICOS" ? "BIPAR_ELETRONICO" : "BIPAR_INVENTARIO",
        codigo: codigo,
        local: local
      });

      return fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: bodyStr
      })
        .then(function(r) { return r.json(); })
        .catch(function() {
          return fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: bodyStr
          })
            .then(function() { return { ok: true, msg: "Enviado" }; })
            .catch(function(e) { return { ok: false, msg: e.message }; });
        });
    }

    function processarCodigo(raw) {
      var codigo = String(raw || "").trim();
      if (!codigo) return;

      if (navigator.vibrate) navigator.vibrate(70);
      bipSonoro();

      var modo = document.getElementById("selModo").value;
      var local = document.getElementById("inpLocal").value.trim();

      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({ tipo: "SPX_CODIGO_LIDO", codigo: codigo, modo: modo, local: local }, "*");
        } catch (e) {}
      }

      document.getElementById("inpManual").value = "";
      setStatus("ok", "⚡ Bipado: " + codigo);
      adicionarHistorico(codigo, "enviando...");

      filaEnvio = filaEnvio.then(function() {
        return enviarParaApi(codigo, modo, local).then(function(res) {
          var box = document.getElementById("historicoBox");
          var textoFinal = res.ok ? (res.msg || "OK") : ("Falha: " + (res.msg || "Sem API"));
          if (box.firstChild) {
            box.firstChild.textContent = box.firstChild.textContent.replace("enviando...", textoFinal);
          }
          if (!res.ok) {
            setStatus("err", "⚠️ " + codigo + " — " + textoFinal);
          } else {
            setStatus("ok", "✅ " + codigo + " (" + textoFinal + ")");
          }
        });
      });
    }

    function iniciarCamera(deviceId) {
      var formatos = [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.DATA_MATRIX
      ];
      if (html5Qr) {
        try { html5Qr.clear(); } catch (e) {}
      }
      html5Qr = new Html5Qrcode("reader", { formatsToSupport: formatos, verbose: false });
      html5Qr.start(
        deviceId || { facingMode: "environment" },
        {
          fps: 12,
          qrbox: function(w, h) {
            var boxW = Math.min(320, Math.floor(w * 0.72));
            var boxH = Math.min(180, Math.floor(h * 0.42));
            return { width: Math.max(160, boxW), height: Math.max(100, boxH) };
          }
        },
        function(texto) {
          var agora = Date.now();
          if (texto === ultimoCod && (agora - ultimoTs) < 1400) return;
          ultimoCod = texto;
          ultimoTs = agora;
          processarCodigo(texto);
        },
        function() {}
      ).catch(function() {
        setStatus("err", "❌ Permita a câmera ou clique em '🔄 Câmera' para selecionar.");
      });
    }

    function trocarCamera() {
      if (!cameras || cameras.length === 0) {
        Html5Qrcode.getCameras().then(function(devs) {
          cameras = devs || [];
          if (cameras.length > 0) {
            idxCam = (idxCam + 1) % cameras.length;
            if (html5Qr) {
              html5Qr.stop().then(function() { iniciarCamera(cameras[idxCam].id); });
            } else {
              iniciarCamera(cameras[idxCam].id);
            }
          }
        });
        return;
      }
      if (cameras.length < 2) return;
      idxCam = (idxCam + 1) % cameras.length;
      if (html5Qr) {
        html5Qr.stop().then(function() { iniciarCamera(cameras[idxCam].id); });
      }
    }

    window.addEventListener("load", function() {
      Html5Qrcode.getCameras().then(function(devs) {
        cameras = devs || [];
        for (var i = 0; i < cameras.length; i++) {
          var lbl = (cameras[i].label || "").toLowerCase();
          if (lbl.indexOf("back") >= 0 || lbl.indexOf("rear") >= 0 || lbl.indexOf("traseira") >= 0 || lbl.indexOf("environment") >= 0) {
            idxCam = i;
            break;
          }
        }
        iniciarCamera(cameras[idxCam] ? cameras[idxCam].id : null);
      }).catch(function() {
        iniciarCamera(null);
      });
    });
  </script>
</body>
</html>
